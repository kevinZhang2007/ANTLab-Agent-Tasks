<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>进阶A：邻段补全开发对照</title>
<style>body{font:16px system-ui;max-width:1400px;margin:24px auto;padding:12px}button,select{padding:8px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f5;padding:12px}section{border-top:1px solid #ccc;padding:12px}#viewer{position:relative;max-width:none}#viewer img{width:100%;display:block}#viewer svg{position:absolute;left:0;top:0;width:100%;height:100%}.evidence{white-space:pre-wrap}.note{color:#555}#viewport{overflow:auto;max-height:750px;border:1px solid #aaa}</style>
<h1>进阶A：同章节邻段补全</h1><p>附加探索，主要进阶交付仍为B。仅开放三道开发题。一次提交运行共享检索词转换及两个回答，最多3次生成，不自动重试。</p>
<select id="task"></select><button id="run">运行本题两方案一次</button><button id="stop">停止本轮服务</button><div id="state">尚未执行</div>
<label>查看方案 <select id="arm"><option value="baseline">baseline：命中两段</option><option value="improved">improved：补同章节邻段</option></select></label>
<p class="note">模型的主张判断是建议；引用存在、PDF定位与语义支持分开。语义复核尚未完成时显示not_checked。</p>
<label>回看已保存HTTP记录（不生成） <input id="savedfile" type="file" accept="application/json"></label><section id="result"></section><section><h2>PDF物理页与区域</h2><div id="locator-examples">定位组件抽查（仅原文锚点，不是模型结果）：</div><label>缩放 <input id="zoom" type="range" min="0.5" max="2" step="0.25" value="1"></label><a id="pdf" target="_blank">打开原PDF物理页</a><div id="viewport"><div id="viewer"><img id="page"><svg id="boxes"></svg></div></div><div id="location"></div></section>
<script>
const token='__TOKEN__';let tasks=[],pair=null,region=null;const el=id=>document.getElementById(id);
const text=(tag,value)=>{const x=document.createElement(tag);x.textContent=value;return x};
async function load(){tasks=await (await fetch('/api/development')).json();for(const t of tasks){const o=document.createElement('option');o.value=t.id;o.textContent=t.id+' '+t.claim;el('task').append(o)}for(const a of await (await fetch('/api/locator-examples')).json()){const b=text('button',a.block.doc_id+' 定位抽查');b.onclick=()=>openRegion(a.block.doc_id,a.location.regions[0]);el('locator-examples').append(b)}}
function show(){let root=el('result');root.replaceChildren();if(!pair)return;root.append(text('h2','整对请求 '+pair.request_id));root.append(text('pre',JSON.stringify({claim:pair.claim,doc_ids:pair.doc_ids,snapshot:pair.snapshot,shared_query_run_id:pair.shared_query?.run_id,terms:pair.retrieval_terms,seed_ids:pair.seed_ids,added_neighbors:pair.added_neighbors,pair_elapsed_seconds:pair.pair_elapsed_seconds},null,2)));let a=pair.arms[el('arm').value];if(!a){root.append(text('p','本方案尚未完成'));return}root.append(text('h3',el('arm').value+' / 主任务 '+a.main_task_id));root.append(text('pre',JSON.stringify({run_id:a.raw_record.run_id,raw_content:a.raw_record.content,claim_judgment:a.claim_judgment,claim_judgment_source:a.claim_judgment_source,locator_status:a.locator_status,citation_semantic_support:'not_checked',answer_stage_seconds:a.answer_stage_wall_seconds,shared_query_cost_share:a.shared_query_cost_share,allocated_total_seconds:a.allocated_total_seconds,cost_note:a.cost_note},null,2)));for(const e of a.evidence){const box=document.createElement('div');box.className='evidence';box.append(text('pre',JSON.stringify(e,null,2)));const b=text('button','回看 '+e.block_id+' 原文区域');b.disabled=e.location.locator_status!=='valid';b.onclick=()=>openRegion(e.doc_id,e.location.regions[0]);box.append(b);root.append(box)}const details=document.createElement('details');details.append(text('summary','本方案实际输入的完整原段落'));details.append(text('pre',JSON.stringify(a.actual_input_passages,null,2)));root.append(details)}
function openRegion(doc,r){region={doc,...r};el('page').src='/assets/'+doc+'-'+r.page+'.png';el('pdf').href='/reader?doc_id='+encodeURIComponent(doc)+'&page='+r.page;el('pdf').textContent='打开 '+doc+' 物理页 '+r.page;el('boxes').setAttribute('viewBox','0 0 '+r.page_width+' '+r.page_height);el('boxes').replaceChildren();for(const b of r.boxes){const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',b.bbox[0]);rect.setAttribute('y',b.bbox[1]);rect.setAttribute('width',b.bbox[2]-b.bbox[0]);rect.setAttribute('height',b.bbox[3]-b.bbox[1]);rect.setAttribute('fill','rgba(255,190,0,.28)');rect.setAttribute('stroke','#946000');rect.setAttribute('stroke-width','.5');el('boxes').append(rect)}el('location').textContent='物理页 '+r.page+'；PDF左上角原点、point；题包原始词/行框，不冒充逐字符精度。';zoom()}
function zoom(){if(region)el('viewer').style.width=(region.page_width*Number(el('zoom').value))+'px'}
el('savedfile').onchange=async()=>{try{const data=JSON.parse(await el('savedfile').files[0].text());const stored=data.response||data;if(!stored.request_id||!stored.arms||!stored.claim)throw new Error('不是本页面记录');pair=stored;el('state').textContent='已保存结果回看（0新增生成） '+pair.request_id;show()}catch(e){el('state').textContent='回看失败：'+e.message}};
el('zoom').oninput=zoom;el('arm').onchange=show;
el('run').onclick=async()=>{let t=tasks.find(x=>x.id===el('task').value);el('run').disabled=true;el('state').textContent='正在执行，不自动重发。';try{let response=await fetch('/api/run-pair',{method:'POST',headers:{'Content-Type':'application/json','X-A-Session':token},body:JSON.stringify({task_id:t.id,claim:t.claim,doc_ids:t.doc_ids,snapshot:t.snapshot,mode:'paired_live'})});let value=await response.json();if(!response.ok)throw new Error(JSON.stringify(value));pair=value;el('state').textContent='已保存 '+pair.request_id+' / '+pair.status;show()}catch(e){el('state').textContent='停止/失败：'+e.message}finally{el('run').disabled=false}};
el('stop').onclick=async()=>{await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json','X-A-Session':token},body:'{}'});el('state').textContent='已请求停止自有服务'};load();
</script></html>
