<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>上下文实验起始台</title>
<style>body{font:16px system-ui;max-width:1000px;margin:35px auto;padding:20px;color:#182330}select,button{padding:10px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f7;padding:20px}small{color:#546273}</style>
<h1>上下文实验起始台</h1><p>这是骨架，不是完成的作业。先实现 student.py。预览不调用模型；模拟结果不能作实验证据。</p>
<label>样例<select id="case"></select></label><label>条件<select id="condition"><option>R0</option><option>R1</option><option>R2</option><option>K</option><option>E</option></select></label>
<label>版本<select id="variant"><option value="baseline">基线</option><option value="improved">改进</option></select></label>
<label>模式<select id="mode"><option value="dry">仅预览</option><option value="mock">模拟联通</option><option value="paid">自费API</option></select></label>
<button id="run">执行一次</button><p id="status" role="status"></p><pre id="result">等待输入。请自行补充对照结果呈现与分析。</pre>
<script>
const $=id=>document.getElementById(id);
fetch('/api/cases').then(r=>r.json()).then(xs=>xs.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' '+c.question;$('case').append(o)}));
$('run').onclick=async()=>{if($('mode').value==='paid'&&!confirm('本次将发起一次自费API请求，是否继续？'))return;
$('run').disabled=true;$('status').textContent='处理中…';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Assessment-Session':'__SESSION_TOKEN__'},body:JSON.stringify({case_id:$('case').value,condition:$('condition').value,variant:$('variant').value,mode:$('mode').value})});const data=await r.json();$('result').textContent=JSON.stringify(data,null,2);$('status').textContent=r.ok?'结果已保存，是否正确仍需核验':'执行未完成';}catch(e){$('status').textContent=String(e)}finally{$('run').disabled=false}};
</script></html>
